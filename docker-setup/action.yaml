name: Setup docker
description: Sets up docker with buildx for use in other actions.

inputs:
  buildx_version:
    description: "The buildx version to use."
    default: v0.37.1

runs:
  using: composite
  steps:
    - name: setup docker context for buildx
      id: buildx-context
      shell: bash
      run: docker context create builders

    - name: setup docker buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        endpoint: builders
        version: ${{ inputs.buildx_version }}

    - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      with:
        version: v0.22.1
