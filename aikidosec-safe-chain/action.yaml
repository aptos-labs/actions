name: Setup Aikido Safe Chain
description: Install Aikido Safe Chain in CI mode so package manager commands are wrapped with malware protection.

runs:
  using: composite
  steps:
    - name: Install safe-chain
      shell: bash
      run: |
        # Pinned to AikidoSec/safe-chain 1.5.20. GitHub releases are immutable;
        # the SHA-256 matches the official CI install command in the upstream README.
        installer="${RUNNER_TEMP:-/tmp}/install-safe-chain.sh"
        curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.20/install-safe-chain.sh -o "$installer"
        echo "0ad25efe15d1fa56105157a454d647223e78eb0c53d1f85e3d10afcd722e7bfd  $installer" | sha256sum -c -
        sh "$installer" --ci
        rm -f "$installer"
